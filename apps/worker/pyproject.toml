[project]
name = "hawk-scanner-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.28,<1.0",
  "redis[hiredis]>=5.2,<7.0",
  "aiosmtplib>=3.0,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "numpy>=2.0,<3.0",
  "scikit-learn>=1.6,<2.0",
  "xgboost>=2.1,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
